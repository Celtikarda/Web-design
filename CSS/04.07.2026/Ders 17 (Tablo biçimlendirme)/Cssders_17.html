<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    table{
        background-color: aqua;
        background-image: url("images\ \(2\).jpg"); /* Resim yolu direkt böyle */ 
        background-size:cover; /* Resmi çerçevelesin ve ana hatları gözüksün diye */
        
        letter-spacing: 0px; /* Harfler arası boşluk için */
        width: 200px;
        height: 200px;
        background-position: center; /* Arkadaki fotoyu ortalamsı için */
         /* border Kutular arası boşluğu yok eder */
    }
th{
 font-family: 'Courier New', Courier, monospace;
 font-weight: bolder;
 box-shadow: 0px 5px 200px black;
}
tr{
    font-style: italic;
    font-family: 'Times New Roman', Times, serif;
    text-align: center;
    color: beige; 
}
td {
font-family: Arial, Helvetica, sans-serif;

}
</style>
</head>

<body>
    <table border="1">
        <tr>

            <th>Ülke</th>
            <th>Nüfus</th>
        </tr>
        <tr>

            <td>86 milyon </td>

        <tr>

        </tr>



    </table>

</html>
