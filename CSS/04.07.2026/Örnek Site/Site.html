<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASUS Tuf Gaming</title>
    <link rel="shortcut icon" href="/CSS/04.07.2026/Örnek Site/images.png">
    <meta name="description" content="Asus TUF Gaming oyuncu laptopları ve bilgisayar ürünleri mağazası.">
    <meta name="keywords" content="gaming laptop, bilgisayar, RTX laptop">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            min-height: 200vh;
            border-width: 2px;
            border-style: solid;
            border-color: #ffb000;
            background-color: #0d0d0d;
            margin: 0px;
            border-radius: 1px;

        }


        header {
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 60px;
            background-color: #0d0d0d;
            box-shadow: 0 0 20px #ffb000;
            border-bottom: 2px solid #ffb000;


            position: fixed;
            /* Sayfayı kaydırsan da yukarıda sabit kalır */
            top: 0;
            /* En üste yapıştırır */
            left: 0;
            /* En sola yapıştırır */
            width: 100%;
            /* fixed olunca daralmasın diye tam genişlik verdik */
            box-sizing: border-box;
            /* padding (60px) yüzünden sağa taşma yapmasın diye ekledik */
            z-index: 1000;
            /* Diğer elemanların (örneğin resmin) her zaman üstünde dursun diye */
        }

        article {
            height: 90vh;
            width: 100%;
            background-image: url("kv_v2-p-3200.webp");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;




            margin-top: 60px;
            /* Header'ın yüksekliği kadar yukarıdan boşluk bıraktık */

        }

        .logo {

            width: 100px;
            height: 45px;
            background-image: url("pngegg.png");
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;

        }


        ul li {
            list-style-type: none;


        }

        nav {

            display: flex;
            gap: 35px;


        }


        nav a {
            font-family: 'Exo 2', sans-serif;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-decoration: none;
            color: antiquewhite;
        }

        nav a:hover {

            color: #ffb000;

        }

        #menu {
            text-align: center;
            text-decoration: whitesmoke;



        }

        h1 {
            font-family: "Orbitron", sans-serif;
            padding-top: 1000px;
            margin: 0px;
            font-weight: 900;
            color: white;

        }

        h2 {

            font-family: "Orbitron", sans-serif;

            margin: 0px;
            font-weight: 900;
            color: #ffb000;



        }

        p {
            background-image: url("nvidia-geforce-rtx.jpg");
            width: 50px;
            height: 30px;
            display: flex;
            justify-content: center;
        }
    </style>

</head>

<body>
    <header>

        <div class="logo"></div>

        <nav>
            <a href="#overview">OVERVIEW</a>
            <a href="#performance">PERFORMANCE</a>
            <a href="#cooling">COOLING</a>
            <a href="#display">DISPLAY</a>
            <a href="#specs">SPECS</a>
        </nav>

    </header>

    <article>
        <div id="menu">

            <h2>THE TRUE DEFİNİTİON OF GAMING</h2>
            
        </div>
    </article>


    <div id="aside">


    </div>

    <div id="footer"></div>


</body>
