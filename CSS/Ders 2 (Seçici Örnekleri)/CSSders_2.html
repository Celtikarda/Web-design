<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seçiciler</title>

    <style>
        h1 {
            color: red;
        }

        .kutu {
            color: blue;
        }

        #baslik {
            color: green;
        }

        p.h34 {
            color: purple;
        }
    </style>
</head>

<body>

    <h1>Normal Başlık</h1>

    <h2 class="kutu">Bu bir kutu</h2>
    <p class="kutu">Bu paragraf da kutu class'ına sahip.</p>
    <div class="kutu">Bu da bir div.</div>

    <h2 id="baslik">Özel Başlık</h2>

    <p class="h17">Bu paragraf etkilenir.</p>
    <div class="h17">Bu div etkilenmez.</div>

</body>

</html>
