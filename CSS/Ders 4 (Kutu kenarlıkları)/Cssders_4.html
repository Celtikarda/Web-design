<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kutu Kenarkıları</title>
    <style>
        h1 {
            width: 250px;
            margin: 10px;
            padding: 10px;
            border-style: solid;
            text-align: center;
            border-color: aqua;
            border-radius: 0px 0px 10px 10px;
            color: blue;
        }

        h2 {
            border: 3px;
            width: 250px;
            border-style: groove;
            border-color:black;
            border-radius: 10px 10px 0px 0px;
            color: blueviolet;
            margin: 10px; 
            padding: 10px;
        }

        p {
            border-width: thin;
            /* border kalınlığı */
            width: 250px;
            margin: 10px;
            padding: 10px;
            border-radius: 0px 0px 10px 0px;
            /* border köşelerini yuvarlatır */
            border-style: double dashed dotted solid;
            /* border stilleri  her köşe için */
        }
    </style>

</head>

<body>
    <h1>Baslik</h1> <!-- Css kodları bir kutu şeklinde gördüğünden outputta satır boyunca kutu oluştu-->
    <h2>Alt Baslik</h2>
    <p>Paragraf</p>
    <p>Pc</p>
    <p>Bilgisayar</p>

</body>

</html>
