<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Float</title>
</head>
<style>
    div {
        border-style: solid;
        border-color: red;
        border-width: 5px;
        width: 100px;
        height: 50px;
        float: left;
        margin: 20px;
        background-color: yellow;
        box-shadow: 10px 10px 5px;
        font-family: Arial, Helvetica, sans-serif;
        font-style: italic;
        text-align: center;
        display: flex;
        justify-content: center;
        align-items: center;
    }
</style>

<body>
    <div id="kutu1">
        Kutu1
    </div>
    <div id="kutu2">
        Kutu2
    </div>
    <div id="kutu3">
        Kutu3
    </div>

</body>

</html>
