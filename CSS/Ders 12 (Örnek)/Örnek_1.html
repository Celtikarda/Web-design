<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Örnek</title>
    <style>
        #Sayfa {
            background-color: red;
            border-style: solid;
            width: 300px;
            height: 300px;
            margin: 0 auto;
            /*Sayfayı ortalamak için  önemli bir özellik */

        }

        header {
            border-style: dotted;
            background-color: yellow;
            width: 250px;
            height: 50px;
            text-align: center;
            /*Yazıyı ortalamak için çok çok önemli bir özellik */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-style: italic;

        }

        nav {
            border-style: dashed;
            background-color: aqua;
            width: auto;
            height: 30px;
            text-align: center;

        }

        article {
            border-style: solid;
            background-color: green;
            width: 180px;
            height: 150px;
            margin: auto;
            float: left;
            text-align: center;

        }

        aside {
            border-style: double;
            background-color: chocolate;
            width: 108px;
            height: 150px;
            float: right;
            text-align: center;

        }

        footer {
            border-style: initial;
            background-color: darkmagenta;
            width: 300px;
            height: 208px;
            text-align: center;

        }
    </style>

</head>

<body>
    <div id="Sayfa"> <!--Sayfadaki bütün nesneleri kapsar -->
        <header>
            Bu bir başlıktır

        </header>
        <nav>
            Bu bir menüdür
        </nav>
        <article>
            Ana menü
        </article>
        <aside>
            Bu bir yan menüdür
        </aside>
        <footer>
            Bu bir altbilgidir
        </footer>


    </div>


</body>

</html>
