<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gölgelendiriciler</title>
    <style>

        p {  /* p etiketi için stil tanımlaması,  */
            background-color: lightblue;
            border: solid black;
            box-shadow: 10px 10px 5px grey inset ; /* gölge efekti üçüncü parametre: bulanıklık  inset içi için ilk parametre x-offset, ikinci parametre y-offset */
            border-radius: 5px;
        }
        .paragraf{
            text-shadow:10px 10px 5px green ;
        } 

    </style>
</head>
<body>

    <p>bu bir paragraf</p>
    <p>bu bir paragraf</p>
    
    <div class="paragraf">
     <p>Bu bir text</p>
    </div>
</body>
</html>
