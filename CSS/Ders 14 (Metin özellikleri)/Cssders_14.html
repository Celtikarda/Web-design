<!DOCTYPE html>
<html lang="tr">

<head>
    <style>
        p {
            /* Paragraflar için özellikler*/
            text-indent: 100px;
            /* ilk satırda kaç px boşluk olsun*/
            text-align: left;
            /* Yazıyı hangi tarafa çekmek için*/
            line-height: 10px;
            /* Satırlar arası boşluk için*/

            /*Metin için özellikler*/
            font-family: Arial, Helvetica, sans-serif;
            font-size: 5px;
            /*Yazı tipi boyutu*/
            font-weight: bold;
            /* Yazı kalınlığı için*/
            font-style: italic;
            font-variant: small-caps;
            /*Zaten büyük olan harfler  büyük kalır ,  küçük harfler büyük harfe dönüşür ama daha küçük boyutta görünür*/
            text-transform: capitalize;
            /* Bütün kelimelerin baş harflerini büyük harf yapar lowercase ile küçük*/
            text-decoration: underline;
            /* Metinlerin altını çizer line-through dersek üzerini , overline ise kelimenin üstünü çizer*/
            letter-spacing: normal;
            /* Harfler arası boşluk*/
            word-spacing: normal;
            /*Kelimeler arası boşluk*/

        }
    </style>
</head>

<body>

    <h1>Merhaba Dünya</h1>

    <p>
        Bu bir paragraf metnidir.
        Bu bir paragraf metnidir.
        Bu bir paragraf metnidir.
    </p>

    <p>
        Bu bir paragraf metnidir.
        Bu bir paragraf metnidir.
        Bu bir paragraf metnidir.
    </p>

</body>

</html>
