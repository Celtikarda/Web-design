<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overflow</title>

    <style>
        .div {
            border-color: black;
            border-style: solid;
        }

        #buyuk {
            width: 30px;
            height: 30px;
            background-color: lightblue;

            /* overflow: hidden; Taşan içeriği gizler */
            /* overflow: scroll; Taşan içeriğe kaydırma çubuğu ekler */
            /* overflow: auto; Taşan içeriğe kaydırma çubuğu ekler, taşmayan içeriğe eklemez */
            /* overflow: visible; Taşan içeriği gösterir */
            /* Overflow = Taşma demek */
        }

        #kucuk {
            width: 15px;
            height: 15px;
            background-color: lightgreen;
        }
    </style>
</head>

<body>

    <div id="buyuk">
        wjkfbvwhbfjwehjf wejf
    </div>

    <div id="kucuk">
        ohugfıswubgfısbıfbıbgw
    </div>

</body>

</html>
