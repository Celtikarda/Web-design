<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        class Uye { // Uye adlı sınıf oluşturuldu. 
            constructor(UyeNo) { // Constructor ile parametre belirlendi.
                this.UyeNo = UyeNo; // This komutu sınıfı temsil eder, parametreyesine değer atar.
            }
        }
        var uye1 = new Uye(1);
        var uye2 = new Uye(2);

        document.write("Uye no:"+ uye1.UyeNo + " Uye no:" + uye2.UyeNo); //uye1 isimli nesnenin tanımlanmış olan no'su için uye1.UyeNo kullandık.

    </script>
</body>

</html>
