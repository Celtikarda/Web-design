<body>
    <script>
        var toplam=0, Nword;
        Nword = Number(prompt("Sayı giriniz:"));
        for(var a=0;a<=Nword;a=a+3) {
            toplam=toplam+ a; //Döngüden gelen sayıları bu komut sayesinde topladık.

        }
        document.write("Toplam:" + toplam);

    </script>
</body>
