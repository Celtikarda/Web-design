<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Değer döndürmeyen çok parametreli fonksiyonlar</title>
</head>

<body>
    <script>
        //Çok parametreli fonksiyon oluşturalım.
        function fonksiyonAdı(çokparametreli1, çokparametreli2, çokparametreli3) { //Parametreleri fonksiyonun içine tanımladık. 
            document.write("İsim:" + çokparametreli1 + "<br>");
            document.write("Soyisim:" + çokparametreli2 + "<br>"); //Her parametreyi olması gerektiği gibi biligiye ulaşması gerektiği gibi ulaştırdık.
            document.write("Yas:" + çokparametreli3 + "<br>");
        }
        fonksiyonAdı("Burak", "Yılmaz", 25); //Fonksiyon çağırılırken sırası önemlidir. Sırayla çağırılır. Parametre arasına virgül koymayı unutmayalım. Number tipinde ise tırnak içine yazmaya gerek yoktur.
    </script>
</body>

</html>
