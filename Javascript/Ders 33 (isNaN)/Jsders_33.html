<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        //isNaN() fonksiyonu, test etmek istediğimiz değerin Number olup olmadığını belirlemek için kullanılır. Eğer geçerli ise false geçerli değilde true döndürür.
        var sayi;
        sayi = Number(prompt("Bir sayı giriniz:"));
        if (isNaN(sayi)) {
            alert("Geçerli sayi giriniz!!");
        }
        else {
            alert("Geçerli sayi girdiniz!!");
            document.write("Girdiğiniz sayı: " + sayi);
        }
    </script>
</body>

</html>
