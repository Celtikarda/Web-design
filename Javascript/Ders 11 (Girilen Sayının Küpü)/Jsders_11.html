<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <script>
        var sayı , küp;
        
        sayı=prompt("Sayı giriniz:")

        küp=sayı**3; //10 Tane "*" yazmakdansa **x demek daha hızlıdır.

        alert("Sayınız:"+ sayı+   "\n Sayının küpü:"+küp  ); //  Burda bir alta geçmek için alt satıra geçecek cümleden önce "\n" kullanırız.
        
    </script>
</body>
</html>
