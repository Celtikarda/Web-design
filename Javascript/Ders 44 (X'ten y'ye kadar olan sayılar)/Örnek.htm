<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        function alyx(x, y) {
            while (x <= y) {
                document.write("X: " + x + "<br>");
                x++;
            }
        }
        let x = Number(prompt("X:"));
        let y = Number(prompt("Y:"));
        alyx(x, y);
    </script>
</body>

</html>
