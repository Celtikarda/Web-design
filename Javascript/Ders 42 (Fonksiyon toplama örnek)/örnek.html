<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        function toplama(x, y) { //İki tane parametre oluşturduk.
            var topla = x + y; // Burda parametrelere gelecek değerleri yazdık. 
            return topla; //Burası önemli çünkü topla yazmadığımız zaman "undefined" yazısını görürüz.
        }
        x = Number(prompt("S1:"));
        y = Number(prompt("S2:"));

        document.write("Toplam: " + toplama(x, y)); // Document.write ile ekrana yazdırdık. fonksiyon ismini ve tanımlamayıda unutmadık.
    </script>
</body>

</html>
