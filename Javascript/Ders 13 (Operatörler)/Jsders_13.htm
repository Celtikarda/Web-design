<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var d; //Değişken tanımladık.
        d=Number(prompt("Değiken giriniz:")); //Numberle stringten number e çevirdik
        document.write(d);
        document.write("<br>");
        d=++d;//önce 1 artır sonra d ye eşitle
        document.write(d);
        document.write("<br>");
        d=--d;//önce 1 azalt sonra d ye eşitle 
        document.write(d);
        document.write("<br>");
        d=d++;//önce dye eşitle sonra 1 ekle
        document.write(d);
        document.write("<br>");
        
    </script>
</body>
</html>
