<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        var kullanicisifir,toplami=0;
        do {
            kullanicisifir = Number(prompt("0 ile 10 arasında sayı giriniz:"));
            document.write("<br>");
            toplami=document.write("Toplami:"+toplami);
            toplami=toplami+kullanicisifir;
            document.write("<br>");
        }
           while(kullanicisifir!=0);

    </script>
    
</body>

</html>
