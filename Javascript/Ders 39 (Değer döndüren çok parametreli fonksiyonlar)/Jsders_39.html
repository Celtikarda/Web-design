<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function topla(x,y) { // İki parametreli fonksiyonumuzu tanımladık. 
       return x+y; // İşlem yapılmak üzre fonksiyona geldiğinde ne yapılacağını belirledik.
        }
     let sonuc = topla(3,5); // Burası önemli çünkü değişkene eşitlemeyip document.write ile yazdırmazsak sonucu göremeyiz. Değişkene atamazsak sonuç bulunur ama ekrana yazmaz.
     document.write(sonuc);  // Sonucu ekrana yazdık
    </script>
</body>
</html>
