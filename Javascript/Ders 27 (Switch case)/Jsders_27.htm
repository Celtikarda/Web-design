<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bankamatik</title>
</head>

<body>
    <script>
        var gun;
        gun = Number(prompt("Lütfen 1 ile 7 arasında bir sayı giriniz:"));
        switch (gun) {
            case 1:
                document.write("Pazartesi");
                break;
            case 2:
                document.write("Salı");
                break;
            case 3:
                document.write("Çarşamba");
                break;
            case 4:
                document.write("Perşmbe");
                break;
            case 5:
                document.write("Cuma");
                break;
            case 6:
                document.write("Cumartesi");
                break;
            case 7:
                document.write("Pazar");
                break;
            default:
                document.write("Lütfen 1 ile 7 arasında bir sayı giriniz.");
                break;
        }
    </script>
</body>

</html>
