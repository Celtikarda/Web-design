<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //String tipinde hata taptık ona tekrar dikkat edelim.
        var w=Number("0") , toplam=Number("0");
        while(w<12){
            document.write(w+"<br>");
            w++
            toplam=toplam+w;
            
        }
        document.write("Toplamı:"+toplam);
    </script>
</body>
</html>
