<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        var int;//Değişken tanımladık.
        for (int = 0; int < 10; int++) { //0'dan 10'a kadar olan sayıları yazdırmak için for döngüsü kullandık.
            if (int == 5) {//Döngüde 5 e geldiğinde döngüden atlamak için continue kullandık.
                continue;

            }
            document.write("int=" + int + "<br>"); //5 e geldiğinde bu satır çalışmayacak.
        }
    </script>
</body>

</html>
