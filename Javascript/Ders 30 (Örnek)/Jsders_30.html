<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //Kullanıcıdan alınan sayı kadar ekrana "Merhaba" yazdıralım.
        var n; //Değişken tanımladık.
        n=Number(prompt(" sayı giriniz:")); //Değişkeni Number(prompt()) ile kullanıcıdan aldık.
        for(var i=0;i<=n;i++){ //Önce başlangıç değerini verdik, sonra koşul ve son olarak artış değerini verdik.
            document.write("Merhaba" + "<br>"); //Döngüdeki her adımda ekrana Merhaba yazdıracak.
        }
    </script>
</body>
</html>
