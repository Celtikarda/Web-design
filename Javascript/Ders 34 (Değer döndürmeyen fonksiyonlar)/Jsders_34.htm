<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        //İlk fonsksiyonumuzu kodluyoruz. Fonksiyonlar, belirli bir görevi yerine getiren kod bloklarıdır. Fonksiyonlar, programın farklı yerlerinde tekrar tekrar kullanılabilirler. Fonksiyonlar, genellikle bir isimle tanımlanır ve çağrıldığında çalıştırılır.
        function merhaba() {
            document.write("Hello Dünya!!!!<br>"); //Bir tane br kullanarak bütün merhaba fonksiyonu alt alta yazdırır.
        }
        //çağırmak için fonksiyonismi() şeklinde çağırılır.
        merhaba();
        //Tekrar tekrar çağırabiliriz.
        merhaba();
        merhaba();
        merhaba();
        merhaba();
    </script>
</body>

</html>
