<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var i; //i değişkenini tanımladık
        for(i=0;i<=10;i=i+2){ //i değişkenini 0'dan başlatıp 10'a kadar 2'şer artırarak döngüye soktuk
            if(i==8){//i değişkeni 8'e eşit olduğunda break komutu ile döngüyü kıracak
                break;
                document.write("i= "+i+"<br>");//break komutu çalıştığı için bu satır çalışmayacak
            }
            document.write("i="+i+"<br>");//i değişkenini ekrana yazdıracak
        }
    </script>
</body>
</html>
