<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var sayi; //Değişken tanımladık
        sayi=Number(prompt("Sayi giriniz:")); //Number ekledik
        sayi=sayi+1;
        document.write("<strong>"+"Sayiyinın sonucu:"+ sayi + "</strong>") //Kalın yazmasını sağladık. HTML Kodları parantez içindedir.
    </script>
</body>
</html>
