<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Dairenin Alanı ve Çevresi</title>
</head>

<body>

    <script>

        var yaricap, alan, cevre;
        const pi = 3.14;

        yaricap = Number(prompt("Yarıçapı giriniz:"));

        alan = pi * yaricap * yaricap;
        cevre = 2 * pi * yaricap;

        alert("Alan: " + alan);
        alert("Çevre: " + cevre);

    </script>

</body>

</html>
