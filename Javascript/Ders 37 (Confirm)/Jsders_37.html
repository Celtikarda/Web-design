<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm</title>
</head>

<body>
    <script>
        let oyun; //Değişken tanımladık
        oyun = confirm("Oyundan çıkmak istiyor musunuz?"); //Değişkeni confirm'e atadık. Atamazsak içi boş kalır.
        if (oyun == true) { // İki değer döndüreceğinden dolayı if kullandık.
            alert("Oyundan çıkılıyor...");
        } else {
            alert("Oyun devam ediyor...");
        }
    </script>
</body>

</html>
