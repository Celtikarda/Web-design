<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        function nfato(f) {
            let sonuc = 1;
            for (let i = 1; i <= f; i++) {
                sonuc = sonuc * i;
            }
            return sonuc;
        }
        f = Number(prompt("F:"));
        document.write("Sonuc:" + nfato(f));
    </script>
</body>

</html>
