<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablo Oluşturalım</title>
</head>

<body>
    <table bgcolor="black">
        <caption>Spor vakitleri</caption>
        <thead width="560px" border="3px">
            <tr bgcolor="yellow">
                <th width="80px">Pazartesi</th>
                <th width="80px">Salı</th>
                <th width="80px">Çarşamba</th>
                <th width="80px">Perşembe</th>
                <th width="80px">Cuma</th>
                <th width="80px">Cumartesi</th>
                <th width="80px">Pazar</th>
            </tr>

        </thead>
        <tbody align="center">
            <tr bgcolor="danger">
                <td>8-12</td>
                <td>Kapalı</td>
                <td>8-12</td>
                <td>Kapalı</td>
                <td>8-12</td>
                <td>8-10</td>
                <td>Kapalı</td>
            </tr>
        </tbody>
        <tfoot>
          <tr bgcolor="white">
            <td align="center" colspan="7">
                Kurallara uyulması rica olunur.
            </td>
          </tr>
        </tfoot>
    </table>
</body>

</html>
