<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <p>Liste yapmak için select ve option kullalım</p>
    <select>
        <option value="html">html</option>
        <option value="css">css</option>
        <option value="js">js</option>
    </select>
    <br>
    <p>Varsayılan seçenek eklemek için value yanına "selected" eklenir.</p>
    <select>
        <option value="5050">RTX 5050</option>
        <option value="4050">RTX 4050</option>
        <option value="3050" selected>RTX 3050</option>
    </select>
    <br>
    <p>Seçeneği iptal etmek için "disabled" kullanılır.</p>
    <select>
        <option value="5050">RTX 5050</option>
        <option value="4050">RTX 4050</option>
        <option value="3050">RTX 3050</option>
        <option value="GPU"selected disabled>Bir gpu seçiniz:</option>

    </select>

</body>

</html>
